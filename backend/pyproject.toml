[project]
name = "lekgotla-backend"
version = "0.1.0"
description = "Context compiler for AI agent configuration"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.15.0",
  "argon2-cffi>=23.1.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "pip-audit>=2.8.0",
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-bdd>=7.3.0",
  "ruff>=0.9.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrations are generated from alembic/script.py.mako, which imports `op` and `sa`
# because almost every revision needs them. An empty or DDL-only revision does not, and
# editing generated files to satisfy the linter is how migration history gets corrupted.
"alembic/versions/*.py" = ["F401", "I001"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["app", "tests"]
exclude = [".venv", "__pycache__"]
